name: Build LuaEngineUI 1.3.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup and install dependencies
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) {
            $vcpkg = "C:\vcpkg"
          }

          if (-not (Test-Path "$vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            $vcpkg = "C:\vcpkg"
          }

          Write-Host "Using vcpkg: $vcpkg"

          & "$vcpkg\vcpkg.exe" integrate install
          & "$vcpkg\vcpkg.exe" install detours:x64-windows-static
          & "$vcpkg\vcpkg.exe" install "imgui[core,dx12-binding,win32-binding]:x64-windows-static"

          "VCPKG_ROOT=$vcpkg" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: >
          msbuild LuaEngineUI.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:VcpkgTriplet=x64-windows-static
          /p:VcpkgUseStatic=true
          /p:VcpkgEnableManifest=false
          /v:minimal

      - name: Find LuaEngineUI DLL
        shell: pwsh
        run: |
          Write-Host "Searching build outputs..."

          Get-ChildItem -Path . -Recurse -Include *.dll |
            ForEach-Object {
              Write-Host $_.FullName
            }

          $dll = Get-ChildItem -Path . -Recurse -Filter "LuaEngineUI.dll" |
            Select-Object -First 1

          if (-not $dll) {
            throw "Build completed but LuaEngineUI.dll was not found."
          }

          Write-Host "Found DLL:"
          Write-Host $dll.FullName

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact\LuaEngineUI.dll

      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-x64
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
