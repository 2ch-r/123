name: Build LuaEngineUI 1.3.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 3. 下载 LuaEngineUI 对应时代的 ImGui
      # ============================================================
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Download Dear ImGui v1.89.9"
          Write-Host "========================================"

          New-Item -ItemType Directory -Force external | Out-Null

          git clone `
            --depth 1 `
            --branch v1.89.9 `
            https://github.com/ocornut/imgui.git `
            external/imgui

          if (!(Test-Path "external/imgui/imgui.h")) {
              Write-Error "imgui.h not found"
              exit 1
          }

          Write-Host "ImGui downloaded successfully."

      # ============================================================
      # 4. 安装 Lua / sol2 / MinHook
      #
      # 这里直接让 vcpkg 管 Lua。
      # 不再自己调用 cl.exe 编 Lua。
      # ============================================================
      - name: Install dependencies
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Install dependencies"
          Write-Host "========================================"

          vcpkg install `
            lua:x64-windows-static `
            sol2:x64-windows-static `
            minhook:x64-windows-static

      # ============================================================
      # 5. 检查实际安装内容
      # ============================================================
      - name: Show dependency locations
        shell: powershell
        run: |
          $root = "C:\vcpkg\installed\x64-windows-static"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "VCPKG INCLUDE"
          Write-Host "========================================"

          Get-ChildItem "$root\include" |
            Select-Object Name

          Write-Host ""
          Write-Host "Lua headers:"
          Get-ChildItem "$root\include" -Recurse |
            Where-Object {
              $_.Name -in @(
                "lua.h",
                "lauxlib.h",
                "lualib.h"
              )
            } |
            Select-Object FullName

          Write-Host ""
          Write-Host "Lua libraries:"
          Get-ChildItem "$root\lib" |
            Where-Object {
              $_.Name -match "lua"
            } |
            Select-Object Name,FullName

          Write-Host ""
          Write-Host "ImGui:"
          Get-Item "external\imgui\imgui.h"

          Write-Host ""
          Write-Host "sol2:"
          if (Test-Path "$root\include\sol") {
              Get-ChildItem "$root\include\sol" |
                Select-Object -First 10 Name
          }

          Write-Host ""
          Write-Host "MinHook:"
          Get-ChildItem "$root\include" -Recurse |
            Where-Object {
              $_.Name -match "MinHook"
            } |
            Select-Object FullName

      # ============================================================
      # 6. 修复 LuaCore::lua_register
      #
      # lua_register 本质上是 Lua 宏：
      #
      # #define lua_register(L,n,f) ...
      #
      # 所以 LuaCore::lua_register(...) 是错误用法。
      # ============================================================
      - name: Fix LuaCore lua_register
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Patch LuaCore::lua_register"
          Write-Host "========================================"

          $files = Get-ChildItem `
            -Path "LuaEngineUI" `
            -Recurse `
            -Include *.cpp,*.h,*.hpp

          $found = $false

          foreach ($file in $files) {

              $text = [System.IO.File]::ReadAllText(
                  $file.FullName
              )

              if ($text.Contains("LuaCore::lua_register")) {

                  Write-Host "Patching:"
                  Write-Host $file.FullName

                  $text = $text.Replace(
                      "LuaCore::lua_register",
                      "lua_register"
                  )

                  [System.IO.File]::WriteAllText(
                      $file.FullName,
                      $text,
                      [System.Text.UTF8Encoding]::new($false)
                  )

                  $found = $true
              }
          }

          if (!$found) {
              Write-Host "LuaCore::lua_register not found."
              Write-Host "Source may already be patched."
          }

          Write-Host ""
          Write-Host "Remaining occurrences:"

          Get-ChildItem `
            -Path "LuaEngineUI" `
            -Recurse `
            -Include *.cpp,*.h,*.hpp |
          Select-String `
            -Pattern "LuaCore::lua_register"

      # ============================================================
      # 7. 修旧版 LuaEngineUI 与 ImGui 1.89.9 的 API
      #
      # 保险处理：
      # PushAllowKeyboardFocus -> PushTabStop
      # PopAllowKeyboardFocus  -> PopTabStop
      # ============================================================
      - name: Patch old ImGui API
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Patch old ImGui API"
          Write-Host "========================================"

          $files = Get-ChildItem `
            -Path "LuaEngineUI" `
            -Recurse `
            -Include *.cpp,*.h,*.hpp

          foreach ($file in $files) {

              $text = [System.IO.File]::ReadAllText(
                  $file.FullName
              )

              $original = $text

              $text = $text.Replace(
                  "ImGui::PushAllowKeyboardFocus",
                  "ImGui::PushTabStop"
              )

              $text = $text.Replace(
                  "ImGui::PopAllowKeyboardFocus",
                  "ImGui::PopTabStop"
              )

              if ($text -ne $original) {

                  Write-Host "Patched:"
                  Write-Host $file.FullName

                  [System.IO.File]::WriteAllText(
                      $file.FullName,
                      $text,
                      [System.Text.UTF8Encoding]::new($false)
                  )
              }
          }

      # ============================================================
      # 8. 找出 vcpkg 实际 Lua lib 名字
      #
      # 不硬编码 lua53.lib / lua.lib
      # ============================================================
      - name: Detect Lua library
        shell: powershell
        run: |
          $libDir = "C:\vcpkg\installed\x64-windows-static\lib"

          $luaLib = Get-ChildItem `
            $libDir `
            -Filter "*.lib" |
          Where-Object {
              $_.Name -match "^lua.*\.lib$"
          } |
          Select-Object -First 1

          if (!$luaLib) {
              Write-Error "Lua .lib not found"
              exit 1
          }

          Write-Host "Detected Lua library:"
          Write-Host $luaLib.FullName

          "LUA_LIB=$($luaLib.Name)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 9. 编译
      # ============================================================
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          echo ========================================
          echo Build LuaEngineUI Release x64
          echo ========================================

          echo Lua library = %LUA_LIB%

          msbuild LuaEngineUI.sln /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:VcpkgTriplet=x64-windows-static ^
            /p:VcpkgUseStatic=true ^
            /p:VcpkgEnableManifest=false ^
            /p:IncludePath="%GITHUB_WORKSPACE%\external\imgui;%GITHUB_WORKSPACE%\external\imgui\backends;C:\vcpkg\installed\x64-windows-static\include;$(IncludePath)" ^
            /p:LibraryPath="C:\vcpkg\installed\x64-windows-static\lib;$(LibraryPath)" ^
            /p:AdditionalDependencies="%LUA_LIB%;$(AdditionalDependencies)" ^
            /v:minimal

          if errorlevel 1 exit /b 1

      # ============================================================
      # 10. 找 DLL
      # ============================================================
      - name: Find LuaEngineUI DLL
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Find generated LuaEngineUI DLL"
          Write-Host "========================================"

          $dlls = Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter "*.dll" |
          Where-Object {
              $_.FullName -notmatch "\\external\\" -and
              $_.FullName -notmatch "\\packages\\" -and
              $_.FullName -notmatch "\\.git\\"
          }

          $dlls | ForEach-Object {
              Write-Host $_.FullName
          }

          $target = $dlls |
            Where-Object {
                $_.Name -ieq "LuaEngineUI.dll"
            } |
            Select-Object -First 1

          if (!$target) {
              $target = $dlls |
                Where-Object {
                    $_.Name -match "LuaEngineUI"
                } |
                Select-Object -First 1
          }

          if (!$target) {
              Write-Error "LuaEngineUI DLL NOT FOUND"
              exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            artifact |
            Out-Null

          Copy-Item `
            $target.FullName `
            "artifact\LuaEngineUI.dll" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "========================================"

          Get-Item "artifact\LuaEngineUI.dll" |
            Format-List Name,Length,LastWriteTime,FullName

      # ============================================================
      # 11. 上传
      # ============================================================
      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-DX12
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
          retention-days: 7
