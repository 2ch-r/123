name: Build LuaEngineUI 1.3.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT

          if (-not $vcpkg) {
            $vcpkg = "C:\vcpkg"
          }

          Write-Host "Using vcpkg: $vcpkg"

          & "$vcpkg\vcpkg.exe" integrate install

          & "$vcpkg\vcpkg.exe" install `
            detours:x64-windows-static `
            minhook:x64-windows-static `
            sol2:x64-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed."
          }

          "VCPKG_ROOT=$vcpkg" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show dependency locations
        shell: pwsh
        run: |
          Write-Host "=== sol2 ==="
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows-static\include" `
            -Recurse -Filter "sol.hpp" |
            Select-Object FullName

          Write-Host "=== MinHook ==="
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows-static\include" `
            -Recurse -Filter "MinHook.h" |
            Select-Object FullName

      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: >
          msbuild LuaEngineUI.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:VcpkgTriplet=x64-windows-static
          /p:VcpkgUseStatic=true
          /p:VcpkgEnableManifest=false
          /p:IncludePath="%VCPKG_ROOT%\installed\x64-windows-static\include;$(IncludePath)"
          /p:LibraryPath="%VCPKG_ROOT%\installed\x64-windows-static\lib;$(LibraryPath)"
          /v:minimal

      - name: Find LuaEngineUI DLL
        shell: pwsh
        run: |
          Write-Host "=== Searching LuaEngineUI.dll ==="

          $dlls = Get-ChildItem -Path . -Recurse -Filter "LuaEngineUI.dll"

          $dlls | ForEach-Object {
              Write-Host $_.FullName
          }

          $dll = $dlls | Select-Object -First 1

          if (-not $dll) {
              throw "LuaEngineUI.dll was not generated."
          }

          New-Item -ItemType Directory -Force artifact | Out-Null

          Copy-Item `
            $dll.FullName `
            "artifact\LuaEngineUI.dll"

      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-x64
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
