name: Build LuaEngineUI 1.3.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------------
      # LuaEngineUI 是旧工程，不使用 vcpkg 最新 ImGui。
      # 固定 Dear ImGui 1.89.9，避免新版 API 不兼容。
      # ------------------------------------------------------------
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          Write-Host "Downloading Dear ImGui v1.89.9..."
          git clone --depth 1 --branch v1.89.9 https://github.com/ocornut/imgui.git external/imgui

          Write-Host ""
          Write-Host "ImGui directory:"
          Get-ChildItem external/imgui

      # ------------------------------------------------------------
      # 安装项目其余依赖
      # ------------------------------------------------------------
      - name: Install vcpkg dependencies
        shell: powershell
        run: |
          vcpkg install `
            lua:x64-windows-static `
            sol2:x64-windows-static `
            minhook:x64-windows-static

      - name: Show dependency locations
        shell: powershell
        run: |
          Write-Host "=== ImGui ==="
          Get-ChildItem external/imgui

          Write-Host "=== Lua ==="
          Get-ChildItem C:\vcpkg\installed\x64-windows-static\include | Select-Object -First 20

          Write-Host "=== sol2 ==="
          Get-ChildItem C:\vcpkg\installed\x64-windows-static\include\sol | Select-Object -First 20

          Write-Host "=== MinHook ==="
          Get-ChildItem C:\vcpkg\installed\x64-windows-static\include | Where-Object {$_.Name -match "MinHook"}

      # ------------------------------------------------------------
      # Build
      #
      # 关键：
      # external\imgui 必须放在 vcpkg include 前面，
      # 防止编译器又找到 vcpkg 的新版 imgui。
      # ------------------------------------------------------------
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          msbuild LuaEngineUI.sln /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:VcpkgTriplet=x64-windows-static ^
            /p:VcpkgUseStatic=true ^
            /p:VcpkgEnableManifest=false ^
            /p:IncludePath="%GITHUB_WORKSPACE%\external\imgui;%GITHUB_WORKSPACE%\external\imgui\backends;C:\vcpkg\installed\x64-windows-static\include;$(IncludePath)" ^
            /p:LibraryPath="C:\vcpkg\installed\x64-windows-static\lib;$(LibraryPath)" ^
            /v:minimal

      # ------------------------------------------------------------
      # 找 DLL
      # ------------------------------------------------------------
      - name: Find LuaEngineUI DLL
        if: success()
        shell: powershell
        run: |
          Write-Host "=== Searching generated DLL ==="

          $dlls = Get-ChildItem -Path . -Recurse -Filter *.dll |
            Where-Object {
              $_.FullName -notmatch "\\external\\" -and
              $_.FullName -notmatch "\\packages\\"
            }

          $dlls | ForEach-Object {
            Write-Host $_.FullName
          }

          $target = $dlls |
            Where-Object {$_.Name -match "LuaEngineUI"} |
            Select-Object -First 1

          if (-not $target) {
            Write-Error "LuaEngineUI DLL not found."
            exit 1
          }

          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $target.FullName artifact\LuaEngineUI.dll

          Write-Host ""
          Write-Host "SUCCESS:"
          Write-Host $target.FullName

      # ------------------------------------------------------------
      # 上传 DLL
      # ------------------------------------------------------------
      - name: Upload LuaEngineUI DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-DX12
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
